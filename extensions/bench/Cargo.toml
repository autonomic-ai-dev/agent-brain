[package]
name = "tekmor-bench"
version = "1.1.0-rc1"
edition = "2021"
description = "tekmor extension: benchmarks, CI proofs, and latency gates"
license = "MIT"
publish = false

[lib]
name = "tekmor_bench"
path = "src/lib.rs"

[[bin]]
name = "tekmor-bench"
path = "src/main.rs"

[dependencies]
tekmor = { path = "../../tekmor", features = ["extras"] }
tekmor-graphify = { path = "../graphify" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
