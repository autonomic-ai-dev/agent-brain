[package]
name = "agent-brain-bench"
version = "1.0.0-rc5"
edition = "2021"
description = "agent-brain extension: benchmarks, CI proofs, and latency gates"
license = "MIT"
publish = false

[lib]
name = "agent_brain_bench"
path = "src/lib.rs"

[[bin]]
name = "agent-brain-bench"
path = "src/main.rs"

[dependencies]
agent-brain = { path = "../../agent-brain", features = ["extras"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
