[package]
name = "agent-brain-extras"
version = "1.0.0-rc6"
edition = "2021"
description = "agent-brain extension: dataset, digest, fixture, skills-sh, distill, and the gRPC bridge"
license = "MIT"
publish = false

[[bin]]
name = "agent-brain-extras"
path = "src/main.rs"

[dependencies]
agent-brain = { path = "../../agent-brain", features = ["extras"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
tonic = "0.12"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"
