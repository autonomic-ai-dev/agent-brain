[package]
name = "tekmor-extras"
version = "1.1.0-rc1"
edition = "2021"
description = "tekmor extension: dataset, digest, fixture, skills-sh, distill, and the gRPC bridge"
license = "MIT"
publish = false

[[bin]]
name = "tekmor-extras"
path = "src/main.rs"

[dependencies]
tekmor = { path = "../../tekmor", features = ["extras"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
tonic = "0.12"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"
