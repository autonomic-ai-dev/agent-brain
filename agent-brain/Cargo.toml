[package]
name = "agent-brain"
version = "1.0.0-rc5"
edition = "2021"
description = "Fast local MCP router for agents, skills, rules, and memory"
license = "MIT"
repository = "https://github.com/autonomic-ai-dev/agent-brain"
readme = "README.md"
keywords = ["mcp", "cursor", "agent", "router"]
categories = ["command-line-utilities"]
build = "build.rs"

[[bin]]
name = "agent-brain"
path = "src/main.rs"


[features]
default = []
# Eval/bench/skills.sh/dataset/spine_ingest/distill/digest CLI + graphify/AST/gRPC.
# Release/serve builds stay slim; CI and local proofs use `--features extras`.
extras = [
    "dep:prost",
    "dep:tonic",
    "dep:tonic-build",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
]

[dependencies]
agent-brain-core = { path = "crates/agent-brain-core" }
libc = "0.2"
age = "0.11"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
fastembed = "4"
glob = "0.3"
keyring = "3"
opendal = { version = "0.52", features = ["services-s3", "services-fs", "layers-blocking"] }
lru = "0.16.3"
prost = { version = "0.13", optional = true }
regex = "1"
rmcp = { version = "2.1.0", features = ["server", "transport-io", "macros", "client", "transport-child-process"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
secrecy = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
zstd = "0.13"
tempfile = "3"
tree-sitter = { version = "0.24", optional = true }
tree-sitter-rust = { git = "https://github.com/tree-sitter/tree-sitter-rust", optional = true }
tree-sitter-typescript = { git = "https://github.com/tree-sitter/tree-sitter-typescript", optional = true }
tree-sitter-python = { git = "https://github.com/tree-sitter/tree-sitter-python", optional = true }
tree-sitter-go = { git = "https://github.com/tree-sitter/tree-sitter-go", optional = true }
rayon = "1.12.0"

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"
tonic = "0.12"
prost = "0.13"


