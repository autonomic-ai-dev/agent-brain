name: No added comments

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  no-added-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check added comment-like lines
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./scripts/check-added-comments.sh --base "$BASE_REF"
