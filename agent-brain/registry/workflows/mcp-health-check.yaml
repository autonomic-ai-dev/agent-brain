name: MCP Health Check
version: 1
min_spine_version: "0.8.0"
start_node: AuditSchemas

nodes:
  - name: AuditSchemas
    kind: agent
    description: "Run agent-brain doctor and confirm the config, AGENTS.md, and MCP path checks report OK."

  - name: ProbeSkillSearch
    kind: agent
    description: "Call skill_search with the keyword route and confirm at least one skill is returned."

  - name: VerifyRouting
    kind: agent
    description: "Call route_task with an MCP host message; confirm recommended_skills is non-empty and must_apply is present."

  - name: Report
    kind: checkpoint
    description: "Summarize MCP federation status; if failed, store_memory with topic mcp-health and open follow-up."

edges:
  - from: AuditSchemas
    to: ProbeSkillSearch
  - from: ProbeSkillSearch
    to: VerifyRouting
  - from: VerifyRouting
    to: Report
