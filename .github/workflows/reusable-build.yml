name: Reusable build

on:
  workflow_call:
    inputs:
      retention-days:
        description: Artifact retention in days
        type: number
        required: false
        default: 30
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_IDENTITY:
        required: true
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false


env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ship Apple Silicon only for now (signed at build with Developer ID).
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-brain-aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-protoc

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Build release binary
        run: cargo build --release -p agent-brain --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/agent-brain.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/agent-brain" "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "ERROR: APPLE_CERTIFICATE secret is required (release binaries must be Developer ID–signed at build)"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        shell: bash
        run: |
          BIN="dist/${{ matrix.artifact }}"
          xattr -cr "$BIN"
          if [ -z "${APPLE_IDENTITY:-}" ]; then
            echo "ERROR: APPLE_IDENTITY secret is required (Developer ID Application only; ad-hoc disabled)"
            exit 1
          fi
          echo "Signing with Developer ID: $APPLE_IDENTITY"
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" "$BIN"
          codesign --verify --verbose "$BIN"
          CS_OUT="$(codesign -dv --verbose=2 "$BIN" 2>&1 || true)"
          if ! echo "$CS_OUT" | grep -q 'Authority=Developer ID Application:'; then
            echo "ERROR: binary is not Developer ID–signed after codesign"
            echo "$CS_OUT" | head -20
            exit 1
          fi
          echo "$CS_OUT" | head -20

      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "NOTE: APPLE_API_KEY_P8 secret is not configured; skipping notarization."
            exit 0
          fi
          BIN="dist/${{ matrix.artifact }}"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          ZIP="$RUNNER_TEMP/${{ matrix.artifact }}.zip"
          trap 'rm -f "$KEY" "$ZIP"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          zip -j "$ZIP" "$BIN"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
