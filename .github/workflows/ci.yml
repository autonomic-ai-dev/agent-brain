name: CI

# Only run when paths that affect the binary, tests, or CI itself change.
# Skipped for docs/**, *.md, .cursor/**, and other non-runtime files.
# (Proofs/eval/bench stay on schedule or workflow_dispatch — not PR CI.)
# Manual runs always allowed via workflow_dispatch.
on:
  push:
    branches: [master]
    paths:
      - "agent-brain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "Containerfile"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/pipelines/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write
  statuses: write

jobs:
  run-pipeline:
    name: Run CI pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check runtime change paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" || git diff --name-only HEAD~1)
            MATCHED=$(echo "$CHANGED" | grep -v -i -E '(^|/)(changelog\.md|context\.md)$' | grep -v -E '\.md$' | grep -E '^(agent-brain/|Cargo\.|Makefile|Containerfile|scripts/|\.github/)' || true)
            if [ -z "$MATCHED" ]; then
              echo "skip_pipeline=true" >> "$GITHUB_OUTPUT"
              echo "Only non-runtime paths modified; skipping compose pipeline."
              exit 0
            fi
          fi
          echo "skip_pipeline=false" >> "$GITHUB_OUTPUT"

      - uses: aeswibon/pipeline-compose-run@v1.17.1
        if: steps.filter.outputs.skip_pipeline != 'true'
        with:
          pipeline_file: .github/pipelines/ci.yml
          github_token: ${{ github.token }}
          ref: ${{ github.head_ref || github.ref_name }}

