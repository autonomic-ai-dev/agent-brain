name: CI

# Only run when paths that affect the binary, tests, or CI itself change.
# Skipped for docs/**, *.md, .cursor/**, and other non-runtime files.
# (Proofs/eval/bench stay on schedule or workflow_dispatch — not PR CI.)
# Manual runs always allowed via workflow_dispatch.
on:
  push:
    branches: [master]
    paths:
      - "agent-brain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "Containerfile"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/pipelines/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  pull_request:
    branches: [master]
    paths:
      - "agent-brain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "Containerfile"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/pipelines/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  actions: write
  statuses: write

jobs:
  run-pipeline:
    name: Run CI pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aeswibon/pipeline-compose-run@v1.17.1
        with:
          pipeline_file: .github/pipelines/ci.yml
          github_token: ${{ github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
