name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Clippy, tests and hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-protoc

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Clippy
        run: cargo clippy -p tekmor --all-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release -p tekmor --features extras -- --test-threads=1

      - name: Hook tests
        run: python3 tekmor/hooks/test_route_gate.py
