name: Stage test

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-protoc

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Resolve package metadata
        id: meta
        run: |
          version=$(grep '^version' agent-brain/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: cargo test --release -p agent-brain --features extras -- --test-threads=1

      - name: Run hook latency tests
        run: python3 agent-brain/hooks/test_route_gate.py

      - uses: aeswibon/pipeline-compose-export@v1.17.1
        if: success()
        with:
          stage_id: test
          outputs: >-
            {"version":"${{ steps.meta.outputs.version }}",
             "git_sha":"${{ steps.meta.outputs.git_sha }}"}
